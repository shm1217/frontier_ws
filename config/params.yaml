/**:
  ros__parameters:
    # ---------------------------------------------------------
    # 토픽 및 프레임 설정
    # ---------------------------------------------------------
    robot_id: "robot1"
    map_topic: "map"
    cmd_topic: "cmd_vel"
    dwb_cmd_topic: "cmd_vel_dwb"
    dynamic_cmd_topic: "cmd_vel_dynamic"
    scan_topic: "scan"
    map_frame: "map"
    base_frame: "base_footprint"
    global_frame: "world"
    tf_timeout_s: 0.1

    # ---------------------------------------------------------
    # 임계점 및 환경 설정
    # ---------------------------------------------------------
    obstacle_threshold: 60
    free_threshold: 50
    # A* hard clearance. 실제 로봇 footprint보다 과도하게 키우지 않는다.
    inflation_radius_m: 0.30
    frontier_search_radius_m: 8.0
    # 가까운 후보가 없으면 반경을 확장하고, 그래도 없으면 전체 맵을 확인한다.
    frontier_extended_search_radius_m: 12.0
    frontier_full_map_fallback: true

    # ---------------------------------------------------------
    # 안전성 (Clearance)
    # ---------------------------------------------------------
    frontier_clearance_m: 0.40
    # hard inflation 바깥에서도 DWB inflation 반경까지 벽 근접 비용을 적용한다.
    # Unknown은 경로에서 차단하고 frontier의 known-free 경계 셀까지만 이동한다.
    path_clearance_m: 0.55
    path_clearance_cost_weight: 25
    keep_open_cells: 2

    # ---------------------------------------------------------
    # 알고리즘 (DBSCAN)
    # ---------------------------------------------------------
    use_dbscan: true
    dbscan_eps_m: 0.25
    dbscan_min_pts: 10

    # ---------------------------------------------------------
    # Laser Mask
    # ---------------------------------------------------------
    laser_block_ttl: 1.0
    laser_inflation_radius_m: 0.15
    laser_obstacle_max_range: 0.45

    # Dynamic Controller: DWB를 우회하는 동안 적용할 안전 제한
    dynamic_max_linear_speed: 0.08
    dynamic_max_angular_speed: 0.80
    dynamic_stop_distance: 0.32
    dynamic_slow_distance: 0.55
    # 시뮬레이션에서 costmap/TF 갱신 순간의 짧은 지연은 허용하되,
    # 오래된 속도 명령은 재사용하지 않는다.
    dwb_cmd_timeout_s: 1.0

    # ---------------------------------------------------------
    # Stuck 상황 감지
    # ---------------------------------------------------------
    # DWB progress checker(8초)가 먼저 판단하도록 frontier의 선제 취소를 막는다.
    stuck_timeout_s: 8.0
    stuck_min_move_m: 0.02
    stuck_grace_s: 8.0
    # 최신 obstacle/laser mask가 전방 경로를 막으면 stuck 전에 재계획한다.
    path_blocked_lookahead_m: 1.5
    path_blocked_confirm_s: 1.0

    # ---------------------------------------------------------
    # 멀티 로봇 유틸리티 (Weights)
    # ---------------------------------------------------------
    info_gain_radius_m: 1.50 # 후보 지점 중 이 반경 내에서 가장 큰 정보 획득량을 가진 지점 선택
    alpha_info_gain: 10.0
    beta_path_len: 2.0
    delta_reserve: 15.0
    # 중앙 merger가 명령을 보내는 동안 LOCAL frontier를 앵커 방향으로 편향한다.
    rendezvous_anchor_topic: "rendezvous_anchor"
    rendezvous_command_ttl_s: 3.0
    # 중앙 merger의 rendezvous_arrival_radius_m 기본값과 동일하게 유지한다.
    rendezvous_arrival_radius_m: 2.0
    # DWB goal tolerance 근처의 짧은 proxy goal은 반복 전송하지 않는다.
    rendezvous_direct_min_distance_m: 0.6
    rendezvous_utility_weight: 4.0
    reserve_exclusion_radius_m: 2.0 # 다른 로봇의 예약지점과의 최소 거리 지정
    reserve_ttl_s: 6.0
    reserve_refresh_period_s: 1.0
    reserve_out_topic: "/global_goal_reservation"
    # 상대 로봇의 실제 위치를 전역 경로의 임시 장애물로 반영
    robot_position_topic: "/global_robot_positions"
    robot_position_period_s: 0.2
    robot_position_ttl_s: 1.0
    other_robot_radius_m: 0.40
    # 전체 경로가 아니라 로봇 앞쪽 구간에서만 충돌 재계획을 수행한다.
    other_robot_path_lookahead_m: 1.5

    # ---------------------------------------------------------
    # 리플래닝 (Replan)
    # ---------------------------------------------------------
    replan_check_period_s: 0.5
    plan_retry_period_s: 0.75
    min_commit_time_s: 10.0
    ig_drop_thresh: 0.05
    # 목표 선정 후 주변 unknown이 빠르게 줄면, 목적지 도착 전에도 재선정
    ig_drop_ratio: 0.20 # 너무 자주 목표 바꾸면 좀 낮추기
    ig_drop_baseline_min: 0.20
    ig_replan_min_age_s: 10.0
    replan_stop_hold_s: 0.4

    # ---------------------------------------------------------
    # Gate 관련
    # ---------------------------------------------------------
    gate_goal_topic: "goal_assignment"
    map_delta_topic: "map_delta"
    gate_timeout_s: 3.0
    gate_goal_switch_distance_m: 0.75
    gate_goal_min_distance_m: 0.75
    map_delta_period_s: 1.0
    # 한 목표의 stuck가 주변 cluster 전체를 막지 않도록 국소적으로 잠시 제외한다.
    blacklist_ttl_s: 3.0
    blacklist_radius_m: 0.25
    # DWB ABORTED(code 6)는 같은 접근 불가 cluster를 충분히 오래 제외한다.
    dwb_failure_blacklist_ttl_s: 6.0
    dwb_failure_blacklist_radius_m: 0.35
    # 첫 abort에서는 local costmap clear 후 한 번 재계획하고, 재실패 시 제외한다.
    clear_costmap_service: "local_costmap/clear_entirely_local_costmap"
    dwb_recovery_match_radius_m: 0.50
    gate_plan_fail_max: 3

    # ---------------------------------------------------------
    # 로컬 맵 폴백
    # ---------------------------------------------------------
    local_map_topic: "map"
    merge_map_stale_s: 5.0

    # ---------------------------------------------------------
    # 시각화 (Visualization)
    # ---------------------------------------------------------
    enable_viz: true
    path_marker_topic: "path_marker"
    frontier_marker_topic: "frontier_markers"
    infl_marker_topic: "inflation_marker"
    cluster_marker_topic: "cluster_marker"
