controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.02
      max_vel_x: 0.10
      max_vel_theta: 0.60
      min_speed_xy: 0.02
      min_speed_theta: 0.10
      max_speed_xy: 0.10
      acc_lim_x: 0.20
      decel_lim_x: -0.30
      acc_lim_theta: 0.45
      decel_lim_theta: -0.70
      vx_samples: 20
      vtheta_samples: 11
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 2.0
      PathAlign.scale: 6.0 # 기존값: 12.0 # 진행방향 = 경로 방향 정렬도
      # 높을수록 전역 경로를 따르도록 함

      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 5.0 # 기존값: 10.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 16.0 # 기존값: 16.0 # 경로에서 떨어진 정도
      # 높을수록 전역 경로를 따르도록 함

      GoalDist.scale: 12.0 # 기존값: 12.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: world
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.20
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 2.5
      always_send_full_costmap: true
